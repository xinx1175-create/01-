<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>策略竞技场</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#101318; --line:#1e242d; --line2:#2a323d;
    --fg:#d6dbe3; --dim:#79838f; --dim2:#525b66;
    --up:#3ecf8e; --dn:#f0616d; --warn:#d9a441;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--mono);
    font-size:13px; line-height:1.45; -webkit-text-size-adjust:100%;
    padding:0 14px calc(28px + env(safe-area-inset-bottom));
    max-width:820px; margin:0 auto;
  }
  header{padding:18px 0 12px;border-bottom:1px solid var(--line);
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:15px;font-weight:600;letter-spacing:.06em;margin:0}
  .sub{color:var(--dim2);font-size:11px}
  section{padding:14px 0;border-bottom:1px solid var(--line)}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  label{display:block}
  .wide{grid-column:1/-1}
  .lbl{color:var(--dim);font-size:11px;margin-bottom:4px}
  input,select{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--fg);
    font-family:var(--mono);font-size:13px;padding:7px 8px;border-radius:4px}
  input:focus,select:focus{outline:none;border-color:#3d4856}
  input:disabled,select:disabled{color:var(--dim2);border-color:var(--line)}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:transparent;border:1px solid var(--line2);color:var(--dim);
    font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer}
  .chip.on{border-color:#556372;color:var(--fg);background:var(--panel)}
  .chip:disabled{opacity:.45;cursor:default}

  .btns{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;background:var(--panel);border:1px solid var(--line2);color:var(--fg);
    font-family:var(--mono);font-size:13px;padding:9px 0;border-radius:4px;cursor:pointer}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.go{border-color:#2f6b52;color:var(--up)}
  .btn.stop{border-color:#6b3540;color:var(--dn)}

  .hint,.note{margin-top:10px;font-size:11px;line-height:1.6}
  .hint{color:var(--dim2)}
  .note{color:var(--dim)}
  .warn{color:var(--warn)}
  .ok{color:var(--up)}

  .tape{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--dim)}
  .tape b{font-weight:500;color:var(--fg)}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--dim2);margin-right:6px;vertical-align:1px}
  .dot.live{background:var(--up)}
  .dot.err{background:var(--dn)}

  .stabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .stab{background:transparent;border:1px solid var(--line);color:var(--dim2);
    font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:3px;cursor:pointer}
  .stab.on{border-color:#556372;color:var(--fg)}
  .stab.sep{margin-left:8px}
  #chart{display:block;width:100%;height:180px}
  .cleg{margin-top:6px;font-size:11px;color:var(--dim2);display:flex;flex-wrap:wrap;gap:12px}

  .filt{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 10px}

  .card{border:1px solid var(--line);border-left:3px solid var(--dim2);border-radius:4px;
    padding:9px 11px;margin-bottom:7px;cursor:pointer}
  .card.dead{opacity:.38}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .rank{color:var(--dim2);margin-right:7px}
  .tag{color:var(--dim2);margin-right:6px}
  .nm{font-size:13px}
  .desc{color:var(--dim2);font-size:11px;margin-top:2px}
  .eq{text-align:right;white-space:nowrap}
  .eqv{font-size:16px;letter-spacing:-.01em}
  .pct{font-size:11px;margin-top:1px}
  .bar{height:2px;background:var(--line);margin:8px 0 7px;border-radius:1px;overflow:hidden}
  .bar i{display:block;height:100%}
  .stats{display:flex;flex-wrap:wrap;gap:11px;font-size:11px;color:var(--dim2)}
  .stats b{font-weight:400;color:var(--dim)}
  .up{color:var(--up)}
  .dn{color:var(--dn)}
  .flat{color:var(--dim)}

  .detail{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
  .dh{color:var(--dim2);font-size:11px;margin-bottom:5px}
  .spec{font-size:11px;color:var(--dim);line-height:1.7}
  .spec i{font-style:normal;color:var(--dim2)}
  table{width:100%;border-collapse:collapse;font-size:11px}
  td,th{padding:3px 0;text-align:right;white-space:nowrap;font-weight:400}
  th{color:var(--dim2)}
  td:first-child,th:first-child{text-align:left}
  tbody tr td{border-top:1px solid #161b21}
  .none{color:var(--dim2);font-size:11px}
  footer{padding:14px 0;color:var(--dim2);font-size:11px;line-height:1.7}
</style>
</head>
<body>

<header>
  <h1>策略竞技场</h1>
  <div class="sub">24 个方案 · 同一行情 · 各自记账</div>
</header>

<section>
  <div class="grid">
    <label><div class="lbl">本金 USDT</div><input id="cap" type="number" value="50" min="10" step="10"></label>
    <label><div class="lbl">杠杆</div><input id="lev" type="number" value="50" min="1" max="125" step="1"></label>
    <label><div class="lbl">保证金倍率 %</div><input id="mult" type="number" value="100" min="5" max="300" step="5"></label>
    <label><div class="lbl">数据源</div>
      <select id="src">
        <option value="live">Binance 实时行情</option>
        <option value="demo">演示行情（本地生成 · 加速）</option>
      </select>
    </label>
  </div>
  <div class="chips" id="chips"></div>
  <div class="btns">
    <button class="btn go" id="bGo">开始</button>
    <button class="btn stop" id="bStop" disabled>停止</button>
    <button class="btn" id="bReset">重置</button>
  </div>
  <div class="hint" id="hint"></div>
</section>

<section>
  <div class="tape" id="tape"><span><span class="dot"></span>未连接</span></div>
  <div class="note" id="note"></div>
</section>

<section>
  <div class="stabs" id="stabs"></div>
  <canvas id="chart"></canvas>
  <div class="cleg" id="cleg"></div>
</section>

<div class="filt" id="filt"></div>
<div id="board"></div>

<footer id="foot">
  逐仓 · taker 0.036% 进出各收一次 · 维持保证金四档阶梯 · 每 8 小时资金费 0.01% ·
  数量按 step 向下取整、价格按 tick 四舍五入，不足最小下单量或最小名义额直接拒单。<br>
  卡片里的「回测参考」是方案规格里给出的历史数字，不是本次实时模拟的结果，两者不要混看。
</footer>

<script>
'use strict';

/* ═══════════════ 交易所参数 ═══════════════ */

var TAKER = 0.0005 * 0.90 * 0.80;   // 0.000360
var FUND_RATE = 0.0001;             // 每 8 小时
var MAX_POS  = 3;                   // 同时持仓上限（每个标的至多一个）
var DAY_DD   = 0.06;                // 日亏 6% 当天停
var LOSS_RUN = 2;                   // 连亏 2 笔当天停
var DEAD_EQ  = 12;                  // 权益低于此彻底停

var SPEC = {
  BTCUSDT : {tick:0.1,     step:0.001, minQty:0.001, minNotional:100, depth:2000000},
  ETHUSDT : {tick:0.01,    step:0.001, minQty:0.001, minNotional:20,  depth:1000000},
  SOLUSDT : {tick:0.01,    step:1,     minQty:1,     minNotional:5,   depth:300000},
  DOGEUSDT: {tick:0.00001, step:1,     minQty:1,     minNotional:5,   depth:200000},
  XRPUSDT : {tick:0.0001,  step:0.1,   minQty:0.1,   minNotional:5,   depth:250000},
  BNBUSDT : {tick:0.01,    step:0.01,  minQty:0.01,  minNotional:5,   depth:300000}
};
var SYMS = Object.keys(SPEC);

var MM_TIERS = [                    // [名义额上限, 维持保证金率, 速算额]
  [50000,    0.0040, 0],
  [500000,   0.0050, 50],
  [1000000,  0.0100, 2550],
  [Infinity, 0.0250, 17550]
];
function mmTier(n){
  for(var i=0;i<MM_TIERS.length;i++) if(n<=MM_TIERS[i][0]) return MM_TIERS[i];
  return MM_TIERS[MM_TIERS.length-1];
}
function roundTick(px,tick){ return Math.round(px/tick)*tick; }
function floorStep(q,step){ return Math.floor(q/step + 1e-9)*step; }
function slipOf(notional,depth){ return 0.00005 + 0.0015*Math.sqrt(notional/depth); }

/* ═══════════════ 指标 ═══════════════ */

var MIN = {'1m':1,'3m':3,'5m':5,'15m':15,'1h':60,'4h':240};

function trueRange(b,p){ return Math.max(b.h-b.l, Math.abs(b.h-p.c), Math.abs(b.l-p.c)); }
function calcATR(bars,n){
  var L=bars.length; if(L<n+1) return null;
  var s=0; for(var i=L-n;i<L;i++) s+=trueRange(bars[i],bars[i-1]);
  return s/n;
}
function calcRSI(bars,n){
  var L=bars.length; if(L<n+1) return null;
  var g=0,l=0;
  for(var i=L-n;i<L;i++){ var d=bars[i].c-bars[i-1].c; if(d>0) g+=d; else l-=d; }
  if(l===0) return 100;
  return 100 - 100/(1 + (g/n)/(l/n));
}
function meanSd(bars,n){
  var L=bars.length; if(L<n) return null;
  var s=0,i;
  for(i=L-n;i<L;i++) s+=bars[i].c;
  var m=s/n, v=0;
  for(i=L-n;i<L;i++) v+=(bars[i].c-m)*(bars[i].c-m);
  return {m:m, sd:Math.sqrt(v/n)};
}
function median(a){
  if(!a.length) return null;
  var b=a.slice().sort(function(x,y){ return x-y; }), h=b.length>>1;
  return b.length%2 ? b[h] : (b[h-1]+b[h])/2;
}
function emaStep(prev,v,n){ var k=2/(n+1); return prev===null ? v : v*k + prev*(1-k); }

/* 收盘突破前 n 根高 / 低 */
function brk(c,n){
  var b=c.bars, L=b.length; if(L<n+1) return 0;
  var hi=-Infinity, lo=Infinity;
  for(var i=L-1-n;i<L-1;i++){ if(b[i].h>hi)hi=b[i].h; if(b[i].l<lo)lo=b[i].l; }
  var x=b[L-1].c;
  return x>hi ? 1 : (x<lo ? -1 : 0);
}

/* ═══════════════ 24 个方案 ═══════════════
   字段：tf 周期 · sl 止损 · ts 追踪启动 · tg 追踪回撤 · mb 最长持仓根数 · mgn 保证金%
   trend:false 表示不套 1H 趋势过滤（只有对照组 H）
   ref 是规格里给出的回测参考，不参与撮合，只在展开里显示
   加方案：往这个数组再推一条即可
══════════════════════════════════════════ */

function T1(c){ return c.hour>=13 && c.hour<19; }          // UTC 美股时段

var STRATS = [
/* ── 第一梯队 ── */
{ id:'V', name:'超高频宽跑', tier:1, color:'#3ecf8e', tf:'1m', sl:0.0040, ts:0.040, tg:0.020, mb:1200, mgn:0.30,
  desc:'破前 10 根，止损 0.40%，追踪放到 4%/2% 让赢单跑',
  ref:{tpd:11.9, wr:63, pf:1.52, med:'$1,548', ruin:'22%', p1k:'54.8%'},
  sig:function(c){ return brk(c,10); } },

{ id:'N', name:'超高频', tier:1, color:'#57a9ff', tf:'1m', sl:0.0040, ts:0.015, tg:0.008, mb:600, mgn:0.30,
  desc:'破前 10 根，追踪 1.5%/0.8%',
  ref:{tpd:18.8, wr:59, pf:1.32, med:'$491', ruin:'27%', p1k:'41.4%'},
  sig:function(c){ return brk(c,10); } },

{ id:'R', name:'超高频美盘', tier:1, color:'#c084fc', tf:'1m', sl:0.0040, ts:0.015, tg:0.008, mb:600, mgn:0.30,
  desc:'破前 10 根，只在 UTC 13:00–19:00 做',
  ref:{tpd:9.1, wr:61, pf:1.38, med:'$499', ruin:'19%（最低）', p1k:'39.2%'},
  sig:function(c){ return T1(c) ? brk(c,10) : 0; } },

{ id:'X', name:'高波超高频', tier:1, color:'#22d3ee', tf:'1m', sl:0.0040, ts:0.015, tg:0.008, mb:600, mgn:0.30,
  desc:'破前 10 根，且 ATR(14) > 200 根中位 ×1.2',
  ref:{tpd:13.0, wr:58, pf:1.31, med:'$294', ruin:'27%', p1k:'34.3%'},
  sig:function(c){ var i=c.ind; if(!i.atrMed || !(i.atr > i.atrMed*1.2)) return 0; return brk(c,10); } },

{ id:'Q', name:'三重共振', tier:1, color:'#fbbf24', tf:'1m', sl:0.0040, ts:0.015, tg:0.008, mb:600, mgn:0.30,
  desc:'破前 10 根，1H 与 4H 同向，且量 > 20 根均量 ×1.2',
  ref:{tpd:16.0, wr:58, pf:1.31, med:'$273', ruin:'29%', p1k:'34.2%'},
  sig:function(c){
    if(!c.reg || c.reg4!==c.reg) return 0;
    var i=c.ind; if(!i.vavg20 || !(i.vol > i.vavg20*1.2)) return 0;
    return brk(c,10); } },

{ id:'L', name:'美股时段', tier:1, color:'#fb923c', tf:'1m', sl:0.0040, ts:0.020, tg:0.010, mb:600, mgn:0.30,
  desc:'破前 20 根，只在 UTC 13:00–19:00 做',
  ref:{tpd:7.7, wr:60, pf:1.36, med:'$247', ruin:'24%', p1k:'30.0%'},
  sig:function(c){ return T1(c) ? brk(c,20) : 0; } },

/* ── 第二梯队 ── */
{ id:'I', name:'双周期共振', tier:2, color:'#4ade80', tf:'3m', sl:0.0060, ts:0.050, tg:0.030, mb:800, mgn:0.30,
  desc:'破前 20 根，1H 与 4H 趋势必须同向',
  ref:{tpd:5.2, wr:59, pf:1.52, med:'$37', ruin:'47%', p1k:'27.4%'},
  sig:function(c){ if(!c.reg || c.reg4!==c.reg) return 0; return brk(c,20); } },

{ id:'W', name:'RSI 动量', tier:2, color:'#38bdf8', tf:'1m', sl:0.0040, ts:0.015, tg:0.008, mb:600, mgn:0.30,
  desc:'破前 10 根，做多需 RSI 55–75，做空需 RSI 25–45',
  ref:{tpd:18.1, wr:58, pf:1.26, med:'$96', ruin:'37%', p1k:'24.6%'},
  sig:function(c){
    var s=brk(c,10), r=c.ind.rsi;
    if(!s || r===null) return 0;
    if(s===1)  return (r>=55 && r<=75) ?  1 : 0;
    return (r>=25 && r<=45) ? -1 : 0; } },

{ id:'D', name:'高频', tier:2, color:'#a78bfa', tf:'1m', sl:0.0040, ts:0.020, tg:0.010, mb:600, mgn:0.30,
  desc:'破前 20 根，追踪 2%/1%',
  ref:{tpd:15.9, wr:58, pf:1.27, med:'$70', ruin:'41%', p1k:'22.9%'},
  sig:function(c){ return brk(c,20); } },

{ id:'O', name:'连续动量', tier:2, color:'#f472b6', tf:'3m', sl:0.0060, ts:0.050, tg:0.030, mb:800, mgn:0.26,
  desc:'连续 3 根同向 K 线后顺势进',
  ref:{tpd:6.0, wr:58, pf:1.37, med:'$12', ruin:'53%', p1k:'18.2%'},
  sig:function(c){
    var b=c.bars, L=b.length; if(L<3) return 0;
    var up=1, dn=1;
    for(var i=L-3;i<L;i++){ if(!(b[i].c>b[i].o)) up=0; if(!(b[i].c<b[i].o)) dn=0; }
    return up ? 1 : (dn ? -1 : 0); } },

{ id:'T', name:'极限高频', tier:2, color:'#2dd4bf', tf:'1m', sl:0.0030, ts:0.012, tg:0.006, mb:400, mgn:0.30,
  desc:'破前 5 根，止损收到 0.30%',
  ref:{tpd:31.4, wr:59, pf:1.21, med:'$105', ruin:'31%', p1k:'17.1%'},
  sig:function(c){ return brk(c,5); } },

{ id:'J', name:'高波动', tier:2, color:'#eab308', tf:'3m', sl:0.0060, ts:0.050, tg:0.030, mb:800, mgn:0.26,
  desc:'破前 20 根，且 ATR > 中位 ×1.3',
  ref:{tpd:3.9, wr:56, pf:1.39, med:'$36', ruin:'45%', p1k:'15.9%'},
  sig:function(c){ var i=c.ind; if(!i.atrMed || !(i.atr > i.atrMed*1.3)) return 0; return brk(c,20); } },

{ id:'B', name:'快枪手', tier:2, color:'#f97316', tf:'3m', sl:0.0060, ts:0.020, tg:0.010, mb:200, mgn:0.17,
  desc:'破前 10 根，最长只拿 200 根',
  ref:{tpd:10.6, wr:55, pf:1.23, med:'$143', ruin:'18%', p1k:'15.0%'},
  sig:function(c){ return brk(c,10); } },

{ id:'E', name:'顺势回踩', tier:2, color:'#818cf8', tf:'3m', sl:0.0060, ts:0.050, tg:0.030, mb:800, mgn:0.26,
  desc:'趋势向上且 z < −1.5 做多，趋势向下且 z > 1.5 做空',
  ref:{tpd:5.5, wr:61, pf:1.35, med:'$12', ruin:'54%', p1k:'14.7%'},
  sig:function(c){ var z=c.ind.z; if(z===null) return 0; if(z<-1.5) return 1; if(z>1.5) return -1; return 0; } },

{ id:'P', name:'大 K 续势', tier:2, color:'#e879f9', tf:'3m', sl:0.0060, ts:0.050, tg:0.030, mb:800, mgn:0.22,
  desc:'K 线实体 > 1.5×ATR 且顺趋势',
  ref:{tpd:5.3, wr:56, pf:1.30, med:'$30', ruin:'45%', p1k:'11.8%'},
  sig:function(c){
    var b=c.bars, L=b.length, i=c.ind; if(!i.atr) return 0;
    var k=b[L-1];
    if(Math.abs(k.c-k.o) <= 1.5*i.atr) return 0;
    return k.c>k.o ? 1 : -1; } },

{ id:'A', name:'稳健王', tier:2, color:'#60a5fa', tf:'3m', sl:0.0060, ts:0.050, tg:0.030, mb:800, mgn:0.20,
  desc:'破前 20 根，教科书配置',
  ref:{tpd:5.7, wr:56, pf:1.27, med:'$25', ruin:'47%', p1k:'9.9%'},
  sig:function(c){ return brk(c,20); } },

/* ── 第三梯队 ── */
{ id:'U', name:'超高频紧损', tier:3, color:'#94a3b8', tf:'1m', sl:0.0025, ts:0.012, tg:0.006, mb:600, mgn:0.28,
  desc:'破前 10 根，止损 0.25% — 用来演示止损收太紧被噪音扫死',

{ id:'G', name:'放量突破', tier:3, color:'#8b96a5', tf:'3m', sl:0.0060, ts:0.050, tg:0.030, mb:800, mgn:0.13,
  desc:'破前 20 根，且量 > 20 根均量 ×2',
  ref:{tpd:5.3, wr:53, pf:1.17, med:'—', ruin:'—', p1k:'2.9%'},
  sig:function(c){ var i=c.ind; if(!i.vavg20 || !(i.vol > i.vavg20*2)) return 0; return brk(c,20); } },

{ id:'M', name:'宽止损让跑', tier:3, color:'#7d8794', tf:'3m', sl:0.0120, ts:0.060, tg:0.030, mb:800, mgn:0.07,
  desc:'破前 20 根，止损放到 1.2%',
  ref:{tpd:3.3, wr:55, pf:1.17, med:'$67', ruin:'6%（第二低）', p1k:'0.4%'},
  sig:function(c){ return brk(c,20); } },

var TIERS = {1:'第一梯队',2:'第二梯队',3:'第三梯队'};

/* 需要订阅的周期：各方案自己的 + 1m（风控时钟）+ 1h/4h（趋势） */
function neededTF(){
  var m={'1m':1};
  STRATS.forEach(function(s){ m[s.tf]=1; });
  return Object.keys(m).sort(function(a,b){ return MIN[a]-MIN[b]; });
}

/* ═══════════════ 记账 ═══════════════ */

function rejOne(k){ rej[k]=(rej[k]||0)+1; }
function unreal(p){ return p.side*(mark[p.sym]-p.entry)*p.qty; }
function equity(a){
  var e=a.wallet;
  for(var i=0;i<a.pos.length;i++) e+=unreal(a.pos[i]);
  return e;
}
function avail(a){ return a.wallet - a.used; }

function liqPrice(side,entry,qty,margin){
  var t=mmTier(entry*qty), mmr=t[1], amt=t[2];
  return (side*entry*qty - margin - amt) / (qty*(side-mmr));
}

function openPos(a,sym,side,ref,ts){
  var sp=SPEC[sym], S=a.s;
  var eq=equity(a);
  // 名义额 = 权益 × 保证金% × 杠杆
  var notional = eq * S.mgn * cfg.mult * cfg.lev;
  var qty = floorStep(notional/ref, sp.step);
  if(qty < sp.minQty){ rejOne('数量低于最小下单量'); return; }
  if(qty*ref < sp.minNotional){ rejOne('名义额低于最小值'); return; }

  var slip = slipOf(qty*ref, sp.depth);
  var px = roundTick(ref*(1+side*slip), sp.tick);
  if(!(px>0)) return;

  var not=px*qty, margin=not/cfg.lev, fee=not*TAKER;
  if(margin + fee > avail(a)){ rejOne('保证金不足'); return; }

  a.wallet -= fee; a.used += margin; a.fees += fee;
  a.pos.push({sym:sym, side:side, qty:qty, qty0:qty, entry:px, margin:margin,
    entryFee:fee, liq:liqPrice(side,px,qty,margin),
    stop: px*(1 - side*S.sl), stage:0, peak:0, bars:0, t:ts});
}

function closeAll(a,p,ref,reason,ts){
  var sp=SPEC[p.sym], q=p.qty;
  var slip = slipOf(q*ref, sp.depth);
  var px = roundTick(ref*(1 - p.side*slip), sp.tick);
  var gross = p.side*(px-p.entry)*q;
  var fee = px*q*TAKER;

  a.wallet += gross - fee;
  a.used -= p.margin; if(a.used<0) a.used=0;
  a.fees += fee;
  record(a,p,px,q,gross - fee - p.entryFee,reason,ts);
  p.qty=0; drop(a,p);
}

function liquidate(a,p,ts){
  a.wallet -= p.margin;
  a.used -= p.margin; if(a.used<0) a.used=0;
  record(a,p,p.liq,p.qty,-p.margin,'强平',ts);
  p.qty=0; drop(a,p);
}
function drop(a,p){ var i=a.pos.indexOf(p); if(i>=0) a.pos.splice(i,1); }

function record(a,p,px,q,pnl,reason,ts){
  a.n++;
  if(pnl>0){ a.win++; a.gp+=pnl; a.run=0; }
  else { a.gl+=-pnl; a.run++; }
  if(a.run>=LOSS_RUN && !a.halted){ a.halted=true; a.haltWhy='连亏 '+a.run+' 笔'; }
  a.trades.push({t:ts, sym:p.sym, side:p.side, qty:q, entry:p.entry, exit:px, pnl:pnl, why:reason});
  if(a.trades.length>60) a.trades.shift();
}

/* 出场：强平 → 止损/保本 → 保本上移 → 追踪启动 → 峰值回撤全平 */
function riskCheck(a,p,px,ts){
  if(p.qty<=0) return;
  var S=a.s, s=p.side;

  var hitLiq  = (s===1 && px<=p.liq)  || (s===-1 && px>=p.liq);
  var hitStop = (s===1 && px<=p.stop) || (s===-1 && px>=p.stop);
  if(hitLiq && hitStop){                       // 同一根里都被击穿，按价格路径先触及的那个
    if(s===1 ? p.stop>p.liq : p.stop<p.liq) hitLiq=false; else hitStop=false;
  }
  if(hitLiq){ liquidate(a,p,ts); return; }
  if(hitStop){ closeAll(a,p,px, p.stage===0?'止损':'保本', ts); return; }

  var prof = s*(px-p.entry)/p.entry;

  if(p.stage===0 && prof>=S.sl){               // 浮盈达到止损值 → 保本
    p.stage=1;
    p.stop = p.entry*(1 + s*0.001);
  }
  if(p.stage<2 && prof>=S.ts){                 // 追踪启动
    p.stage=2; p.peak=prof;
  }
  if(p.stage===2){
    if(prof>p.peak) p.peak=prof;
    if(p.peak-prof >= S.tg){ closeAll(a,p,px,'追踪',ts); return; }
  }
}

function funding(ts){
  var slot=Math.floor(ts/28800000);
  if(fundSlot===null){ fundSlot=slot; return; }
  if(slot===fundSlot) return;
  fundSlot=slot;
  accts.forEach(function(a){
    a.pos.forEach(function(p){
      var pay=p.side*FUND_RATE*p.qty*mark[p.sym];
      a.wallet-=pay; a.funding+=pay;
    });
  });
}

function guard(a,ts){
  var eq=equity(a);
  if(eq>a.peak) a.peak=eq;
  var dd=(a.peak-eq)/a.peak; if(dd>a.maxdd) a.maxdd=dd;

  var day=Math.floor(ts/86400000);
  if(a.day!==day){ a.day=day; a.dayOpen=eq; a.halted=false; a.haltWhy=''; a.run=0; }
  if(!a.halted && (a.dayOpen-eq)/a.dayOpen >= DAY_DD){ a.halted=true; a.haltWhy='日亏 '+(DAY_DD*100)+'%'; }
  if(eq < DEAD_EQ) a.dead=true;
}

/* ═══════════════ 行情驱动 ═══════════════ */

function onPrice(sym,px,ts){
  mark[sym]=px;
  if(warming) return;
  funding(ts);
  for(var i=0;i<accts.length;i++){
    var a=accts[i];
    for(var j=a.pos.length-1;j>=0;j--){
      var p=a.pos[j];
      if(p.sym===sym) riskCheck(a,p,px,ts);
    }
    guard(a,ts);
  }
}

function calcInd(bk){
  var b=bk.bars, L=b.length, i=bk.ind;
  i.atr = calcATR(b,14);
  bk.atr.push(i.atr===null?0:i.atr);
  if(bk.atr.length>400) bk.atr.shift();
  i.atrMed = bk.atr.length>=200 ? median(bk.atr.slice(-200)) : null;

  i.rsi = calcRSI(b,14);

  var ms = meanSd(b,20);
  i.z   = (ms && ms.sd>0) ? (b[L-1].c-ms.m)/ms.sd : null;
  i.bbwPrev = bk.bbw.length ? bk.bbw[bk.bbw.length-1] : null;
  var bw = (ms && ms.m>0) ? (4*ms.sd)/ms.m : null;
  bk.bbw.push(bw===null?0:bw);
  if(bk.bbw.length>400) bk.bbw.shift();
  i.bbw = bw;
  i.bbwMed = bk.bbw.length>=200 ? median(bk.bbw.slice(-200)) : null;

  i.vol = b[L-1].v;
  if(L>=21){ var s=0; for(var k=L-21;k<L-1;k++) s+=b[k].v; i.vavg20 = s/20; }
  else i.vavg20 = null;

  bk.e9p=bk.e9; bk.e21p=bk.e21;
  bk.e9  = emaStep(bk.e9,  b[L-1].c, 9);
  bk.e21 = emaStep(bk.e21, b[L-1].c, 21);
  i.e9=bk.e9; i.e21=bk.e21; i.e9p=bk.e9p; i.e21p=bk.e21p;
}

function onBar(sym,tf,bar,live){
  var bk=books[sym] && books[sym][tf]; if(!bk) return;
  bk.bars.push(bar);
  if(bk.bars.length>420) bk.bars.shift();
  calcInd(bk);
  if(live) bars++;
  if(!live) return;

  var ts=bar.T, i, j, a, p;

  // 1m 是风控时钟：用极值给所有持仓补一次盘中检查
  if(tf==='1m'){
    for(i=0;i<accts.length;i++){
      a=accts[i];
      for(j=a.pos.length-1;j>=0;j--){
        p=a.pos[j];
        if(p.sym!==sym) continue;
        riskCheck(a,p, p.side===1?bar.l:bar.h, ts);
        if(p.qty>0) riskCheck(a,p, p.side===1?bar.h:bar.l, ts);
        if(p.qty>0) riskCheck(a,p, bar.c, ts);
      }
    }
  }
  mark[sym]=bar.c;

  // 本周期的方案：计持仓根数 → 超时 → 找信号
  var ctx={sym:sym, tf:tf, bars:bk.bars, ind:bk.ind,
           reg:trend[sym].h1.reg, reg4:trend[sym].h4.reg,
           hour:new Date(bar.T-1).getUTCHours()};

  for(i=0;i<accts.length;i++){
    a=accts[i];
    if(a.s.tf!==tf) continue;

    for(j=a.pos.length-1;j>=0;j--){
      p=a.pos[j];
      if(p.sym!==sym) continue;
      p.bars++;
      if(p.bars>=a.s.mb) closeAll(a,p,bar.c,'超时',ts);
    }
    guard(a,ts);
    if(a.dead || a.halted) continue;
    if(a.pos.length>=MAX_POS) continue;
    var held=false;
    for(j=0;j<a.pos.length;j++) if(a.pos[j].sym===sym) held=true;
    if(held) continue;

    var sig=0;
    try{ sig=a.s.sig(ctx)|0; }catch(e){ sig=0; }
    if(sig!==1 && sig!==-1) continue;
    if(a.s.trend!==false && sig!==ctx.reg) continue;   // 1H 趋势过滤
    openPos(a,sym,sig,bar.c,ts);
    guard(a,ts);
  }
}

function onTrendBar(sym,tf,bar){
  var T=trend[sym]; if(!T) return;
  var h = tf==='1h' ? T.h1 : T.h4;
  var c=bar.c;
  h.e20=emaStep(h.e20,c,20);
  h.e50=emaStep(h.e50,c,50);
  h.n++;
  if(h.n<50){ h.reg=0; return; }
  if(c>h.e20 && h.e20>h.e50) h.reg=1;
  else if(c<h.e20 && h.e20<h.e50) h.reg=-1;
  else h.reg=0;
}

/* ═══════════════ 实时行情 ═══════════════ */

function allStreams(){
  var tfs=neededTF().concat(['1h','4h']), out=[];
  cfg.syms.forEach(function(s){
    tfs.forEach(function(tf){ out.push(s.toLowerCase()+'@kline_'+tf); });
  });
  return out;
}

function connect(){
  var url='wss://fstream.binance.com/stream?streams='+allStreams().join('/');
  wsState='connecting'; render();
  try{ ws=new WebSocket(url); }catch(e){ wsState='error'; wsFails++; schedule(); return; }

  ws.onopen=function(){ wsState='live'; render(); };
  ws.onmessage=function(ev){
    var m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    var d=m && m.data;
    if(!d || d.e!=='kline') return;
    var k=d.k, sym=d.s;
    msgs++;
    var bar={t:k.t,T:k.T,o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v};
    if(warming){ mark[sym]=bar.c; render(); return; }
    if(k.i==='1h' || k.i==='4h'){ if(k.x) onTrendBar(sym,k.i,bar); render(); return; }
    if(!books[sym] || !books[sym][k.i]) return;
    onPrice(sym,bar.c,d.E||k.T);
    if(k.x) onBar(sym,k.i,bar,true);
    render();
  };
  ws.onerror=function(){ wsState='error'; };
  ws.onclose=function(){ ws=null; if(running){ wsState='down'; wsFails++; schedule(); } else wsState='idle'; render(); };
}
function schedule(){
  if(retryT) clearTimeout(retryT);
  retryT=setTimeout(function(){ if(running) connect(); },3000);
}

/* 预热：没有历史就得等 200 小时 4H 趋势才成立，所以先用公开 REST 灌一遍 */
var WARM = {'1m':500,'3m':500,'5m':400,'15m':300,'1h':200,'4h':200};
function warmup(done){
  warming=true;
  var g=gen, tfs=neededTF(), jobs=[];
  cfg.syms.forEach(function(sym){
    tfs.forEach(function(tf){ jobs.push([sym,tf,false]); });
    jobs.push([sym,'1h',true]); jobs.push([sym,'4h',true]);
  });
  var pending=jobs.length;
  if(!pending){ warming=false; done(); return; }
  jobs.forEach(function(j){
    fetchK(j[0], j[1], WARM[j[1]]||300, function(rows){
      if(g!==gen) return;                             // 数据源已切走，这批历史作废
      if(rows && rows.length>1){
        warmOK=true;
        var body=rows.slice(0,-1);                    // 末根未收盘
        if(j[2]) body.forEach(function(b){ onTrendBar(j[0],j[1],b); });
        else     body.forEach(function(b){ onBar(j[0],j[1],b,false); });
        mark[j[0]]=rows[rows.length-1].c;
      }
      if(--pending<=0){ warming=false; done(); }
    });
  });
}
function fetchK(sym,iv,limit,cb){
  var u='https://fapi.binance.com/fapi/v1/klines?symbol='+sym+'&interval='+iv+'&limit='+limit;
  fetch(u).then(function(r){ return r.ok?r.json():null; }).then(function(j){
    if(!j || !j.length){ cb(null); return; }
    cb(j.map(function(r){ return {t:r[0],T:r[6],o:+r[1],h:+r[2],l:+r[3],c:+r[4],v:+r[5]}; }));
  }).catch(function(){ cb(null); });
}

/* ═══════════════ 演示行情 ═══════════════
   连不上 Binance（地区限制、公司网络、页面在受限的预览框里）时用这个。
   生成一条 1 分钟价格路径，其余周期全部由它聚合，趋势判定才自洽。
   价格是随机游走，不是真实行情。
══════════════════════════════════════════ */

var SEED={BTCUSDT:95000, ETHUSDT:3200, SOLUSDT:180, DOGEUSDT:0.32, XRPUSDT:2.4, BNBUSDT:900};

function demoBar(sym){
  // 漂移的持续性刻意压低：合成行情如果太"顺",突破类方案会假性暴赚，排名就没有参考价值了
  var d = demoDrift[sym] = (demoDrift[sym]||0)*0.98 + (Math.random()-0.5)*0.00006;
  var o = demoPx[sym];
  var c = o*(1 + d + (Math.random()-0.5)*0.0016);
  if(!(c>0)) c=o;
  demoPx[sym]=c;
  var v = 120 + Math.random()*380;
  if(Math.random()<0.05) v *= 3+Math.random()*4;
  return {o:o, h:Math.max(o,c)*(1+Math.random()*0.0007), l:Math.min(o,c)*(1-Math.random()*0.0007), c:c, v:v};
}
function aggr(arr,t,T){
  var h=-Infinity,l=Infinity,v=0;
  for(var i=0;i<arr.length;i++){ if(arr[i].h>h)h=arr[i].h; if(arr[i].l<l)l=arr[i].l; v+=arr[i].v; }
  return {t:t,T:T,o:arr[0].o,h:h,l:l,c:arr[arr.length-1].c,v:v};
}

function demoStart(){
  var tfs=neededTF().concat(['1h','4h']);
  var WARM_MIN = 14000;                               // 分钟数：够 4H EMA50（200 小时）成立
  demoClock = Date.now() - WARM_MIN*60000;
  warming=true;

  cfg.syms.forEach(function(sym){
    demoPx[sym]=SEED[sym]; demoDrift[sym]=0;
    demoAcc[sym]={};
    tfs.forEach(function(tf){ demoAcc[sym][tf]=[]; });

    var t=demoClock, i, path=[];
    for(i=0;i<WARM_MIN;i++){ var b=demoBar(sym); b.t=t; b.T=t+60000; t+=60000; path.push(b); }

    tfs.forEach(function(tf){
      var per=MIN[tf], keep=WARM[tf]||300, out=[];
      for(i=0;i+per<=path.length;i+=per) out.push(aggr(path.slice(i,i+per), path[i].t, path[i+per-1].T));
      out.slice(-keep).forEach(function(b){
        if(tf==='1h'||tf==='4h') onTrendBar(sym,tf,b);
        if(books[sym][tf]) onBar(sym,tf,b,false);
      });
    });
    mark[sym]=demoPx[sym];
  });

  demoClock += WARM_MIN*60000;
  warming=false; warmOK=true; wsState='demo';

  demoT=setInterval(function(){
    demoClock += 60000;
    cfg.syms.forEach(function(sym){
      var b=demoBar(sym);
      b.t=demoClock-60000; b.T=demoClock;
      msgs++;
      onPrice(sym,(b.o+b.c)/2,demoClock);
      tfs.forEach(function(tf){
        var acc=demoAcc[sym][tf];
        acc.push(b);
        if(acc.length>=MIN[tf]){
          var agg=aggr(acc, acc[0].t, b.T);
          demoAcc[sym][tf]=[];
          if(tf==='1h'||tf==='4h') onTrendBar(sym,tf,agg);
          if(books[sym][tf]) onBar(sym,tf,agg,true);
        }
      });
    });
    render();
  }, 90);
}

/* ═══════════════ 控制 ═══════════════ */

function readCfg(){
  cfg.cap  = Math.max(10, +$('cap').value||50);
  cfg.lev  = Math.min(125, Math.max(1, Math.round(+$('lev').value||50)));
  cfg.mult = Math.max(0.05, (+$('mult').value||100)/100);
  cfg.src  = $('src').value;
  cfg.syms = SYMS.filter(function(s){ return picked[s]; });
  if(!cfg.syms.length){ picked.BTCUSDT=true; cfg.syms=['BTCUSDT']; }
}
function lock(on){
  ['cap','lev','mult','src'].forEach(function(id){ $(id).disabled=on; });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){ c.disabled=on; });
  $('bGo').disabled=on; $('bStop').disabled=!on; $('bReset').disabled=on;
}
function start(){
  if(running) return;
  readCfg(); resetAll();
  running=true; startAt=Date.now(); autoFell=false; lock(true);
  if(cfg.src==='demo'){ demoStart(); render(); return; }

  warmup(function(){ render(); });
  connect();

  // 看门狗：连不上就自动切演示行情，而不是让页面干等
  if(watchT) clearTimeout(watchT);
  watchT=setTimeout(function(){
    if(!running || cfg.src!=='live') return;
    if(bars>0 && msgs>0) return;                  // 已经有行情进来了
    fallbackToDemo();
  }, 7000);
}

function fallbackToDemo(){
  if(retryT){ clearTimeout(retryT); retryT=null; }
  if(ws){ try{ ws.close(); }catch(e){} ws=null; }
  var wasRunning=running;
  running=false;
  resetAll();                                     // gen++ 会让在途的 REST 回调作废
  cfg.src='demo'; $('src').value='demo';
  running=wasRunning; autoFell=true; startAt=Date.now();
  demoStart(); render();
}

function stop(){
  running=false; lock(false);
  if(retryT){ clearTimeout(retryT); retryT=null; }
  if(watchT){ clearTimeout(watchT); watchT=null; }
  if(demoT){ clearInterval(demoT); demoT=null; }
  if(ws){ try{ ws.close(); }catch(e){} ws=null; }
  wsState='idle'; render();
}

function buildChips(){
  var h='';
  SYMS.forEach(function(s){
    h+='<button class="chip'+(picked[s]?' on':'')+'" data-sym="'+s+'">'+s.replace('USDT','')+'</button>';
  });
  $('chips').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){
    c.onclick=function(){
      if(running) return;
      var s=c.getAttribute('data-sym');
      picked[s]=!picked[s];
      if(!SYMS.some(function(x){ return picked[x]; })) picked[s]=true;
      buildChips(); readCfg(); resetAll();
    };
  });
}

/* ═══════════════ 渲染 ═══════════════ */

var rafPending=false;
function render(){
  if(rafPending) return;
  rafPending=true;
  requestAnimationFrame(function(){ rafPending=false; draw(); });
}
function fmt(n,d){
  if(n===null||n===undefined||!isFinite(n)) return '—';
  return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function pxDec(sym){
  var t=SPEC[sym].tick, d=0, x=t;
  while(x<1-1e-9 && d<8){ x*=10; d++; }
  return d;
}
function fmtPx(sym,p){ return fmt(p,pxDec(sym)); }
function clr(v){ return v>0?'up':(v<0?'dn':'flat'); }
function sgn(v,d){ return (v>0?'+':'')+fmt(v,d); }
function pc(v,d){ return (v*100).toFixed(d)+'%'; }
function hhmm(t){
  var x=new Date(t); function p(n){ return (n<10?'0':'')+n; }
  return p(x.getHours())+':'+p(x.getMinutes())+':'+p(x.getSeconds());
}

function drawHint(){
  var lev=Math.max(1,Math.round(+$('lev').value||1));
  var mult=Math.max(0.05,(+$('mult').value||100)/100);
  var cap=Math.max(10,+$('cap').value||50);
  var mx=0, mn=Infinity;
  STRATS.forEach(function(s){ var m=s.mgn*mult; if(m>mx)mx=m; if(m<mn)mn=m; });
  var h='名义额 = 权益 × 保证金% × 杠杆，当前区间 '+fmt(mn*lev,1)+'–'+fmt(mx*lev,1)+' 倍权益。'+
        ' 以 '+fmt(cap,0)+' USDT 起步，最小的方案单笔名义额约 '+fmt(cap*mn*lev,0)+' USDT。';
  if(cap*mn*lev < 100) h+=' <span class="warn">低于 BTC 最小名义额 100，保证金占比最低的几个方案在 BTC 上会被拒单，等权益涨上去才做得动。</span>';
  $('hint').innerHTML=h;
}

function drawNote(){
  if(!running){
    $('note').innerHTML='点「开始」后才会连接行情并开始撮合。'+
      '若你所在网络连不上 Binance，把数据源切到「演示行情」，整套撮合照样跑得起来。';
    return;
  }
  if(cfg.src==='live' && !bars){
    $('note').innerHTML='正在连接 Binance 实时行情…'+
      '<span class="flat">连不上的话会在几秒内自动切到演示行情，不用你做任何事。</span>';
    return;
  }
  if(warming){ $('note').innerHTML='正在拉取历史 K 线预热…'; return; }

  var h='', nT=0, nP=0, nH=0, nD=0;
  accts.forEach(function(a){ nT+=a.n; nP+=a.pos.length; if(a.halted)nH++; if(a.dead)nD++; });
  h='<span class="ok">'+(cfg.src==='demo'?'演示行情运行中':'实时行情运行中')+'</span> · 持仓 '+nP+' · 累计成交 '+nT+'。';

  if(autoFell) h+=' <span class="warn">连不上 Binance，已自动切到演示行情。</span>'+
    '演示价格是本地生成的随机行情，只能验证撮合和界面，不能用来比较方案优劣。'+
    '要用真实行情，把这个页面下载成 HTML 文件，用浏览器直接打开。';

  if(cfg.src==='live' && !warmOK)
    h+=' <span class="warn">历史预热失败</span>，趋势过滤要等实时累计满 50 根 1H / 4H K 线才生效。';

  var waits=[];
  cfg.syms.forEach(function(sym){
    var T=trend[sym]; if(!T) return;
    var need=[];
    if(T.h1.n<50) need.push('1H '+T.h1.n+'/50');
    if(T.h4.n<50) need.push('4H '+T.h4.n+'/50');
    if(need.length) waits.push(sym.replace('USDT','')+' 差 '+need.join('、'));
  });
  if(waits.length) h+=' 趋势累计中：'+waits.join(' · ')+'。';
  else if(!nT && !nP) h+=' 数据已就绪，还没有方案触发信号 —— 要等某根 K 线收盘真的突破 / 回归到位才开仓。';

  if(nH) h+=' <span class="warn">'+nH+' 个账户当日熔断</span>（连亏 '+LOSS_RUN+' 笔或日亏 '+(DAY_DD*100)+'%），停到次日。';
  if(nD) h+=' <span class="dn">'+nD+' 个已出局</span>（权益 < '+DEAD_EQ+'）。';

  var rk=Object.keys(rej);
  if(rk.length) h+=' 累计拒单：'+rk.map(function(k){ return k+' '+rej[k]; }).join(' · ')+'。';
  $('note').innerHTML=h;
}

function drawTape(){
  var s = wsState==='live'||wsState==='demo' ? 'live' : (wsState==='error'||wsState==='down' ? 'err' : '');
  var txt={idle:'未连接',connecting:'连接中',live:'已连接',demo:'演示行情',down:'重连中',error:'重连中'}[wsState]||'—';
  var h='<span><span class="dot '+s+'"></span>'+txt+'</span>';
  if(warming) h+='<span>预热中…</span>';
  h+='<span>收盘 <b>'+bars+'</b></span><span>消息 <b>'+msgs+'</b></span>';
  cfg.syms.forEach(function(sym){
    var T=trend[sym]; if(!T) return;
    function rt(r,n){ return n<50?'<span class="flat">·</span>':(r===1?'<span class="up">↑</span>':(r===-1?'<span class="dn">↓</span>':'<span class="flat">·</span>')); }
    h+='<span>'+sym.replace('USDT','')+' <b>'+(mark[sym]?fmtPx(sym,mark[sym]):'—')+'</b> '+
       '1H'+rt(T.h1.reg,T.h1.n)+' 4H'+rt(T.h4.reg,T.h4.n)+'</span>';
  });
  $('tape').innerHTML=h;
}

function drawStabs(){
  var tfs=neededTF(), h='';
  if(!chartSym || cfg.syms.indexOf(chartSym)<0) chartSym=cfg.syms[0];
  if(!chartTF || tfs.indexOf(chartTF)<0) chartTF=tfs[0];
  cfg.syms.forEach(function(s){
    h+='<button class="stab'+(s===chartSym?' on':'')+'" data-s="'+s+'">'+s.replace('USDT','')+'</button>';
  });
  tfs.forEach(function(tf,i){
    h+='<button class="stab'+(tf===chartTF?' on':'')+(i===0?' sep':'')+'" data-tf="'+tf+'">'+tf+'</button>';
  });
  $('stabs').innerHTML=h;
}

function drawChart(){
  var c=$('chart');
  if(!cfg.syms.length || !books[chartSym]) return;
  var bk=books[chartSym][chartTF];
  var dpr=Math.min(2, window.devicePixelRatio||1);
  var W=c.clientWidth||340, H=180;
  if(c.width!==Math.round(W*dpr)){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
  var g=c.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);
  g.font='10px '+getComputedStyle(document.body).fontFamily;

  var all = bk ? bk.bars : [];
  if(all.length<2){
    g.fillStyle='#525b66'; g.fillText(running?'等待 K 线…':'未开始', 4, H/2);
    $('cleg').innerHTML=''; return;
  }
  var N=Math.min(72, all.length), st=all.length-N, b=all.slice(st);
  var hi=-Infinity, lo=Infinity;
  b.forEach(function(x){ if(x.h>hi)hi=x.h; if(x.l<lo)lo=x.l; });
  var lines=[];
  accts.forEach(function(a){ a.pos.forEach(function(p){
    if(p.sym===chartSym){ lines.push({y:p.entry,c:a.s.color,n:a.s.id,s:p.side});
      if(p.entry>hi)hi=p.entry; if(p.entry<lo)lo=p.entry; }
  }); });
  var pad=((hi-lo)||hi*0.001)*0.08; hi+=pad; lo-=pad;

  var PL=2, PR=56, PT=8, PB=14, cw=(W-PL-PR)/N;
  function Y(v){ return PT + (hi-v)/(hi-lo)*(H-PT-PB); }
  function X(i){ return PL + i*cw + cw/2; }

  g.strokeStyle='#232a33'; g.lineWidth=1;
  [1,-1].forEach(function(dir){
    g.beginPath();
    var started=false;
    for(var i=0;i<N;i++){
      var idx=st+i; if(idx<20) continue;
      var v = dir===1?-Infinity:Infinity;
      for(var j=idx-20;j<idx;j++) v = dir===1?Math.max(v,all[j].h):Math.min(v,all[j].l);
      var x=X(i), y=Y(v);
      if(!started){ g.moveTo(x,y); started=true; } else g.lineTo(x,y);
    }
    g.stroke();
  });

  var bw=Math.max(1, Math.min(6, cw*0.62));
  for(var i=0;i<N;i++){
    var k=b[i], up=k.c>=k.o, x=X(i);
    g.strokeStyle = up?'rgba(62,207,142,.75)':'rgba(240,97,109,.75)';
    g.fillStyle   = up?'rgba(62,207,142,.28)':'rgba(240,97,109,.28)';
    g.beginPath(); g.moveTo(x,Y(k.h)); g.lineTo(x,Y(k.l)); g.stroke();
    var y1=Y(Math.max(k.o,k.c)), y2=Y(Math.min(k.o,k.c));
    g.fillRect(x-bw/2,y1,bw,Math.max(1,y2-y1));
    g.strokeRect(x-bw/2,y1,bw,Math.max(1,y2-y1));
  }

  lines.forEach(function(L){
    var y=Y(L.y);
    g.strokeStyle=L.c; g.globalAlpha=.75; g.setLineDash([3,3]);
    g.beginPath(); g.moveTo(PL,y); g.lineTo(W-PR,y); g.stroke();
    g.setLineDash([]); g.globalAlpha=1;
    g.fillStyle=L.c; g.fillText((L.s===1?'多 ':'空 ')+L.n, W-PR+4, y+3);
  });

  var last=b[N-1].c, ly=Y(last);
  g.strokeStyle='#3d4856'; g.beginPath(); g.moveTo(PL,ly); g.lineTo(W-PR,ly); g.stroke();
  g.fillStyle='#d6dbe3'; g.fillText(fmtPx(chartSym,last), W-PR+4, ly-4);
  g.fillStyle='#525b66';
  g.fillText(fmtPx(chartSym,hi), W-PR+4, PT+4);
  g.fillText(fmtPx(chartSym,lo), W-PR+4, H-PB+4);
  g.fillText(chartSym.replace('USDT','')+' · '+chartTF+' · '+N+' 根', PL+2, H-3);

  var T=trend[chartSym];
  function tt(x,n){ return n<50 ? '<span class="flat">累计 '+n+'/50</span>'
    : (x===1?'<span class="up">多</span>':(x===-1?'<span class="dn">空</span>':'<span class="flat">中性</span>')); }
  $('cleg').innerHTML='<span>细线＝20 根突破通道</span><span>虚线＝持仓入场价</span>'+
    '<span>1H '+tt(T.h1.reg,T.h1.n)+'</span><span>4H '+tt(T.h4.reg,T.h4.n)+'</span>';
}

function drawFilt(){
  var h='<button class="stab'+(tierFilt===0?' on':'')+'" data-t="0">全部 '+STRATS.length+'</button>';
  [1,2,3].forEach(function(t){
    var n=STRATS.filter(function(s){ return s.tier===t; }).length;
    h+='<button class="stab'+(tierFilt===t?' on':'')+'" data-t="'+t+'">'+TIERS[t]+' '+n+'</button>';
  });
  $('filt').innerHTML=h;
}

function drawDetail(a){
  var S=a.s, r=S.ref;
  var h='<div class="detail">';
  h+='<div class="spec">'+
     '<i>周期</i> '+S.tf+' · <i>止损</i> '+pc(S.sl,2)+' · <i>追踪</i> '+pc(S.ts,1)+' 启动 / '+pc(S.tg,1)+' 回撤'+
     ' · <i>最长</i> '+S.mb+' 根 · <i>保证金</i> '+pc(S.mgn,0)+
     (S.trend===false?' · <i>不套趋势过滤</i>':'')+'</div>';
  h+='<div class="spec" style="margin-top:3px"><i>回测参考</i> '+
     r.tpd+' 笔/天 · 胜率 '+r.wr+'% · PF '+r.pf+' · 中位 '+r.med+' · 破产 '+r.ruin+' · 到 $1000 '+r.p1k+'</div>';

  h+='<div class="dh" style="margin-top:9px">持仓 '+a.pos.length+'/'+MAX_POS+
     (a.halted?' · <span class="warn">熔断：'+a.haltWhy+'</span>':'')+'</div>';
  if(!a.pos.length) h+='<div class="none">无</div>';
  else{
    h+='<table><thead><tr><th>标的</th><th>方向</th><th>入场</th><th>现价</th><th>止损</th><th>浮盈</th></tr></thead><tbody>';
    a.pos.forEach(function(p){
      var u=unreal(p);
      h+='<tr><td>'+p.sym.replace('USDT','')+'</td><td class="'+(p.side===1?'up':'dn')+'">'+(p.side===1?'多':'空')+'</td>'+
         '<td>'+fmtPx(p.sym,p.entry)+'</td><td>'+fmtPx(p.sym,mark[p.sym]||0)+'</td>'+
         '<td>'+fmtPx(p.sym,p.stop)+'</td><td class="'+clr(u)+'">'+sgn(u,2)+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  var tr=a.trades.slice(-14).reverse();
  h+='<div class="dh" style="margin-top:9px">最近成交</div>';
  if(!tr.length) h+='<div class="none">无</div>';
  else{
    h+='<table><thead><tr><th>时间</th><th>标的</th><th>方向</th><th>出场</th><th>盈亏</th></tr></thead><tbody>';
    tr.forEach(function(t){
      h+='<tr><td>'+hhmm(t.t)+'</td><td>'+t.sym.replace('USDT','')+'</td>'+
         '<td class="'+(t.side===1?'up':'dn')+'">'+(t.side===1?'多':'空')+'</td>'+
         '<td>'+t.why+'</td><td class="'+clr(t.pnl)+'">'+sgn(t.pnl,2)+'</td></tr>';
    });
    h+='</tbody></table>';
  }
  return h+'</div>';
}

function draw(){
  drawHint(); drawTape(); drawNote(); drawStabs(); drawChart(); drawFilt();

  var rows=accts.map(function(a){ return {a:a, eq:equity(a)}; });
  rows.sort(function(x,y){ return y.eq-x.eq; });
  var best=rows.length?Math.max(rows[0].eq,1e-9):1;
  var days=startAt?Math.max((Date.now()-startAt)/86400000,1/1440):0;

  var h='', shown=0;
  rows.forEach(function(r,i){
    var a=r.a, S=a.s, eq=r.eq;
    if(tierFilt && S.tier!==tierFilt) return;
    shown++;
    var ret=(eq/cfg.cap-1)*100;
    var pf=a.gl>0?a.gp/a.gl:(a.gp>0?Infinity:0);
    var wr=a.n?a.win/a.n*100:0;
    var w=Math.max(2,Math.min(100,eq/best*100));
    h+='<div class="card'+(a.dead?' dead':'')+'" data-id="'+S.id+'" style="border-left-color:'+S.color+'">'+
       '<div class="top"><div>'+
         '<div class="nm"><span class="rank">'+(i+1)+'</span><span class="tag">'+S.id+'</span>'+S.name+
           (a.dead?' <span class="dn">已出局</span>':(a.halted?' <span class="warn">熔断</span>':''))+'</div>'+
         '<div class="desc">'+S.tf+' · '+S.desc+'</div>'+
       '</div><div class="eq">'+
         '<div class="eqv">'+fmt(eq,2)+'</div>'+
         '<div class="pct '+clr(ret)+'">'+sgn(ret,2)+'%</div>'+
       '</div></div>'+
       '<div class="bar"><i style="width:'+w.toFixed(2)+'%;background:'+S.color+'"></i></div>'+
       '<div class="stats">'+
         '<span>成交 <b>'+a.n+'</b></span>'+
         '<span>胜率 <b>'+fmt(wr,0)+'%</b></span>'+
         '<span>PF <b>'+(pf===Infinity?'∞':fmt(pf,2))+'</b></span>'+
         '<span>回撤 <b>'+fmt(a.maxdd*100,1)+'%</b></span>'+
         '<span>费 <b>'+fmt(a.fees,2)+'</b></span>'+
         '<span>笔/天 <b>'+(days?fmt(a.n/days,1):'0.0')+'</b></span>'+
       '</div>'+
       (expanded[S.id]?drawDetail(a):'')+
       '</div>';
  });
  if(!shown) h='<div class="none">该梯队没有方案。</div>';
  $('board').innerHTML=h;
}

/* ═══════════════ 事件 ═══════════════ */

$('board').addEventListener('click',function(e){
  var c=e.target.closest?e.target.closest('.card'):null;
  if(!c) return;
  var id=c.getAttribute('data-id');
  expanded[id]=!expanded[id];
  draw();
});
$('stabs').addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('.stab'):null;
  if(!t) return;
  if(t.getAttribute('data-s')) chartSym=t.getAttribute('data-s');
  if(t.getAttribute('data-tf')) chartTF=t.getAttribute('data-tf');
  draw();
});
$('filt').addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('.stab'):null;
  if(!t) return;
  tierFilt=+t.getAttribute('data-t');
  draw();
});
['lev','mult','cap'].forEach(function(id){ $(id).addEventListener('input',drawHint); });
addEventListener('resize',render);

$('bGo').onclick=start;
$('bStop').onclick=stop;
$('bReset').onclick=function(){ if(running) return; readCfg(); resetAll(); };

buildChips();
readCfg();
resetAll();
setInterval(function(){ if(running) render(); },1000);

// 打开即跑：先试真实行情，连不上自动切演示，不需要先点按钮
start();
</script>
